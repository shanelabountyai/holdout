<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Readout decision states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 880px; height: 980px; box-sizing: border-box; background: #F7F7F4; color: #16181D; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.45; padding: 32px; display: flex; flex-direction: column; gap: 12px;">
<h1 style="margin: 0 0 4px; font-family: 'Space Grotesk', sans-serif; font-size: 24px;">Decision banner, checked top to bottom; the first match wins</h1>
<sc-for list="{{states}}" as="s" hint-placeholder-count="9">
<div style="display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start;">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; color: #565B66; padding-top: 10px;">{{s.n}}</span>
<div style="background: {{s.bg}}; color: {{s.fg}}; border: {{s.border}}; border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px;">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px;"><span aria-hidden="true">{{s.g}}</span> {{s.title}}</span>
<span style="font-size: 14px;">{{s.body}}</span>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      stop: { bg: '#FCE6DD', fg: '#7A2509', border: '2px solid #9A2E0B' },
      hold: { bg: '#FBF0DA', fg: '#5C3800', border: '1px solid #C77A00' },
      good: { bg: '#E6EEF9', fg: '#163F75', border: '1px solid #1D4F91' },
      neutral: { bg: '#FFFFFF', fg: '#16181D', border: '1px solid #D9D9D2' }
    };
    const states = [
      ['1', '✕', 'Stop: sample-ratio mismatch', 'Traffic split broke (χ² p < 0.001). Rates, comparisons and guardrails are hidden; units per arm and the test stay.', 'stop'],
      ['2', '○', 'Not enough data', 'An arm has fewer than 100 units.', 'neutral'],
      ['3', '✓', 'Ship "Get it today"', 'Best winner cleared zero and its guardrails held. Permanent.', 'good'],
      ['3', '◐', 'Guardrail moved: don’t ship yet', 'The winner moved a guardrail (refund rate up). A person decides.', 'hold'],
      ['3', '◐', 'Keep running: SRM not yet checkable', 'A winner, but the sample is below 9,835 units, too small to rule out a broken split.', 'hold'],
      ['4', '✕', 'Worse: keep control', 'Every treatment is significantly worse.', 'stop'],
      ['5', '–', 'Inconclusive at planned sample size', 'Plan reached, no sequential call; the fixed-horizon p is shown as reference only.', 'neutral'],
      ['5', '–', 'No detectable effect at planned sample size', 'Plan reached and no hint of an effect either way.', 'neutral'],
      ['6', '●', 'Keep running', 'Day 6 of about 14. Nothing to call yet.', 'neutral']
    ].map(([n, g, title, body, k]) => ({ n, g, title, body, ...T[k] }));
    return { states };
  }
}
</script>
</body>
</html>
